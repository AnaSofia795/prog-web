<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Producto</title>
    <!-- Enlace a la hoja de estilos externa -->
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- Contenedor principal de la tarjeta -->
    <div class="tarjeta">
        <!-- Contenedor para la imagen con efecto -->
        <div class="contenedor-imagen">
            <img src="imagenes/pusheen.jpg" alt="Peluche Pusheen">
        </div>
        <!-- Información del producto -->
        <span class="categoria">Juguetes</span>
        <h2>Peluche</h2>
        <p>Pusheen Cherry Macaron Squisheen.</p>
        <span class="precio">$500 MXN</span>
        <!-- Botón con interacción simple al hacer clic -->
        <button onclick="this.innerText='¡Agregado!'; this.style.backgroundColor='#4bb543';">Comprar</button>
    </div>

</body>
</html>
