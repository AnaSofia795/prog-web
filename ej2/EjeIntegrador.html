<form id="inscripcion">
    <input name="nombre" required>
    <input name="correo" type="email" required>
    <input name="password" type="password" minlength="8" maxlength="20" required>
    <input name="edad" type="number" min="18" max="65" required>
    <input name="cuota" type="number" min="0" step="0.01" required>
    <input name="telefono" type="tel" pattern="[0-9]{10}" required>
    <button type="submit">Inscribirme</button>
</form>
