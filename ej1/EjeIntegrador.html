<form id="clientes" novalidate>
    <label for="cli-nom">Nombre:</label>
    <input type="text" id="cli-nom" name="nombre" required>
    <label for="cli-mail">Correo:</label>
    <input type="email" id="cli-mail" name="correo" required>
    <label for="cli-tel">Teléfono:</label>
    <input type="tel" id="cli-tel" name="telefono">
    <label for="cli-ser">Servicio:</label>
    <select id="cli-ser" name="servicio" required>
        <option>Básico</option>
        <option>Premium</option>
    </select>
    <button type="submit">Registrar</button>
</form>
